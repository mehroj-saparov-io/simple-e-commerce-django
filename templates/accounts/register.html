{% extends "base.html" %}

{% block content %}

<style>
/* 🔥 Faqat shu page uchun */
.form-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 14px;
    background-color: #eef2ff;   /* indigo-50 */
    border: 1px solid #c7d2fe;   /* indigo-200 */
    color: #111827;              /* gray-900 (MUHIM!) */
    font-size: 15px;
}

.form-input::placeholder {
    color: #6366f1;              /* indigo-500 */
}

.form-input:focus {
    outline: none;
    background-color: #ffffff;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,.25);
}
</style>

<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">
            Create Account
        </h2>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Username
                </label>
                <input
                    type="text"
                    name="{{ form.username.name }}"
                    value="{{ form.username.value|default:'' }}"
                    class="form-input"
                    placeholder="Enter username"
                    required
                >
            </div>

            {% if form.email %}
            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Email
                </label>
                <input
                    type="email"
                    name="{{ form.email.name }}"
                    value="{{ form.email.value|default:'' }}"
                    class="form-input"
                    placeholder="Enter email"
                >
            </div>
            {% endif %}

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Password
                </label>
                <input
                    type="password"
                    name="{{ form.password1.name }}"
                    class="form-input"
                    placeholder="Create password"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Confirm Password
                </label>
                <input
                    type="password"
                    name="{{ form.password2.name }}"
                    class="form-input"
                    placeholder="Repeat password"
                    required
                >
            </div>

            <!-- Errors -->
            {% if form.errors %}
            <div class="text-sm text-red-600 bg-red-50 p-3 rounded-lg">
                {{ form.errors }}
            </div>
            {% endif %}

            <button
                type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold
                       hover:bg-indigo-700 transition duration-200"
            >
                Register
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Already have an account?
            <a href="{% url 'login' %}" class="text-indigo-600 font-medium hover:underline">
                Login
            </a>
        </p>

    </div>
</div>

{% endblock %}
