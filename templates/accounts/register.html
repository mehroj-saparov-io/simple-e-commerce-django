{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 text-center">Register</h2>

    <form method="post" class="bg-white p-6 rounded-lg shadow-md space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">
            Register
        </button>
    </form>

    <p class="mt-4 text-center text-gray-700">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">Login here</a>.
    </p>
</div>
{% endblock %}
