{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl md:text-3xl font-bold mb-6 text-gray-800">{{ product.name }}</h2>

    <div class="flex flex-col md:flex-row gap-6">
        <!-- Product Image -->
        <div class="flex-1 flex justify-center items-center">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="w-full max-w-sm rounded-lg shadow-md" alt="{{ product.name }}">
            {% else %}
                <img src="{% static 'products/default.png' %}" class="w-full max-w-sm rounded-lg shadow-md" alt="Default Image">
            {% endif %}
        </div>

        <!-- Product Details -->
        <div class="flex-1 flex flex-col justify-between">
            <div class="mb-4">
                <p class="text-lg md:text-xl font-semibold text-indigo-600 mb-2">Price: ${{ product.price }}</p>
                <p class="text-gray-700 mb-4">{{ product.description }}</p>
            </div>

            <!-- Add to Cart Form -->
            <form action="{% url 'cart_add' product.id %}" method="post" class="flex flex-col sm:flex-row sm:items-center gap-3">
                {% csrf_token %}
                <input type="number" name="quantity" value="1" min="1" class="w-20 p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">Add to Cart</button>
            </form>
        </div>
    </div>

    <div class="mt-6">
        <a href="{% url 'product_list' %}" class="text-indigo-600 hover:underline">&larr; Back to Products</a>
    </div>
</div>
{% endblock %}
