{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md mt-8">

    <!-- Product Title -->
    <h2 class="text-2xl md:text-3xl font-bold mb-6 text-gray-800 text-center md:text-left">
        {{ product.name }}
    </h2>

    <div class="flex flex-col md:flex-row gap-8">

        <!-- Product Image -->
        <div class="flex-1 flex justify-center items-center">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}"
                     class="w-full max-w-sm rounded-lg shadow-md object-cover transition-transform duration-300 hover:scale-105">
            {% else %}
                <img src="{% static 'products/default.png' %}" alt="Default Image"
                     class="w-full max-w-sm rounded-lg shadow-md object-cover transition-transform duration-300 hover:scale-105">
            {% endif %}
        </div>

        <!-- Product Details -->
        <div class="flex-1 flex flex-col justify-between">

            <div class="mb-6">
                <p class="text-xl md:text-2xl font-semibold text-indigo-600 mb-3">Price: ${{ product.price }}</p>
                <p class="text-gray-700 leading-relaxed">{{ product.description }}</p>
            </div>

            <!-- Add to Cart Form -->
            <form action="{% url 'cart_add' product.id %}" method="post" class="flex flex-col sm:flex-row sm:items-center gap-3">
                {% csrf_token %}
                <input type="number" name="quantity" value="1" min="1"
                       class="w-24 p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
                <button type="submit"
                        class="bg-indigo-600 text-white px-6 py-3 rounded-md font-semibold hover:bg-indigo-700 transition">
                    Add to Cart
                </button>
            </form>
        </div>

    </div>

    <!-- Back Link -->
    <div class="mt-8 text-center md:text-left">
        <a href="{% url 'product_list' %}" class="text-indigo-600 hover:underline font-medium">
            &larr; Back to Products
        </a>
    </div>
</div>
{% endblock %}
